services:
  backend:
    image: book-scanner-api:latest
    build: ./backend
    container_name: book-scanner-api
    restart: unless-stopped
    environment:
      PORT: 3000
      MYSQL_HOST: ${MYSQL_HOST:-8.157.18.157}
      MYSQL_PORT: ${MYSQL_PORT:-3319}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-books}
    ports:
      - "${API_PORT:-3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    image: book-scanner-web:latest
    build: ./frontend
    container_name: book-scanner-web
    restart: unless-stopped
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-backend:3000}
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - backend
