services:
  backend:
    image: book-scanner-api:latest
    build: ./backend
    container_name: book-scanner-api
    restart: unless-stopped
    environment:
      PORT: 3000
      MYSQL_HOST: ${MYSQL_HOST:-host.docker.internal}
      MYSQL_PORT: ${MYSQL_PORT:-3319}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-MySql@2024}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-books}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-a123456}
      ISBN_WORK_APP_KEY: ${ISBN_WORK_APP_KEY:-}
      BOOK_META_API: ${BOOK_META_API:-}
      DOUBAN_API_KEY: ${DOUBAN_API_KEY:-}
      SCRAPE_LOG_BODY_MAX: ${SCRAPE_LOG_BODY_MAX:-8000}
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - ./backend/logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    image: book-scanner-web:latest
    build: ./frontend
    container_name: book-scanner-web
    restart: unless-stopped
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-backend:3000}
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - backend
